services:
  - type: web
    name: worksmartai-backend
    env: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_ENABLED
        value: true
      - key: ML_PREDICTION_ENABLED
        value: true

